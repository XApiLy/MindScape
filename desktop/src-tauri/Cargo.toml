[package]
name = "mindscape-desktop"
version = "0.1.0"
description = "MindScape desktop conversation graph runtime"
authors = ["MindScape Team"]
edition = "2024"

[lib]
name = "mindscape_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
keyring = "4.1.6"
futures-util = "=0.3.32"
fastembed = { version = "=5.8.1", default-features = false, features = ["ort-load-dynamic"] }
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["load-dynamic", "ndarray", "std"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tauri = { version = "2", features = [] }
thiserror = "2"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1.9"
zip = { version = "=7.2.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
